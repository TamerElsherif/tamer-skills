# curriculum.yaml — fill in, then: .venv/bin/python skills/tcs-curriculum/scripts/validate_curriculum.py curriculum.yaml
schema_version: "1.0"
course:
  id: expense-claims-netsuite            # kebab-case
  title: How to submit expenses in NetSuite
  # title_ar: كيفية تقديم المصروفات في نت سويت
  domain: software-procedure
  domain_pack: _template                 # or a folder under domains/
  audience: {level: beginner, roles: [learner], segments: [staff], notes: "new hires, finance-light"}
  languages: {primary: en-US, subtitles: [ar-EG]}
  total_minutes: 15
  verbosity: standard
  wpm: 130
  complexity: low
  targets: [video, video-vertical, jobaid, scorm]
  aspects: ["16:9", "9:16"]
  renderer: remotion                     # openmontage | remotion | none
  # compliance: ["ISO 27001 A.6.3 evidence"]
objectives:
  - {id: O1, text: "Identify the receipts and cost codes needed before starting a claim", bloom: remember, type: procedure, source_ids: [S01]}
  - {id: O2, text: "Submit an expense claim in NetSuite with receipts attached", bloom: apply, type: procedure, source_ids: [S01]}
  - {id: O3, text: "Fix the three most common rejection reasons", bloom: analyze, type: procedure, source_ids: [S01]}
modules:
  - id: M1
    title: Expense claims
    lessons:
      - {id: M1L1, title: Before you start, objective_ids: [O1], formats: [screencast-sim, job-aid], duration_min: 4, status: planned,
         rationale: "procedure + software -> screencast-sim + job aid"}
      - {id: M1L2, title: Step by step, objective_ids: [O2], formats: [screencast-sim, job-aid], duration_min: 6, status: planned}
      - {id: M1L3, title: Check and fix, objective_ids: [O3], formats: [screencast-sim], duration_min: 5, status: planned}
approval: {status: draft}               # draft -> approved (orchestrator gate) | auto-approved (autopilot)
