    loc: § Northwind Co. — Payment Verification Policy … § 6. Report it
    summary: 'Fictional Northwind Co. payment verification policy FIN-SEC-07 v2.1 (effective 2026-03-01), all staff:
      verify any payment or bank-detail change by calling back a number already on file; two-person approval for
