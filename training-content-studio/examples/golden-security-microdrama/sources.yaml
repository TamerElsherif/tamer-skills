glossary:
- term: Business email compromise (BEC)
  definition: Fraud that impersonates executives, colleagues or suppliers by email to trick employees into sending
    money or changing bank details.
  source_id: S01
- term: CEO fraud
  definition: A BEC variant where the attacker impersonates a senior executive to push an urgent or secret payment.
  source_id: S01
- term: Callback verification
  definition: Calling the requester back on a number already on file, never one given in the request.
  source_id: S01
