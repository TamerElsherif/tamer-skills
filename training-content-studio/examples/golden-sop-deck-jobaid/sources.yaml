glossary:
- term: Business expense
  definition: A cost an employee pays personally that is necessary for Northwind Co. work and is not a personal
    benefit.
  source_id: S01
- term: Receipt
  definition: Itemised proof of payment showing vendor, date, items and amount; a card statement alone is not a
    receipt.
  source_id: S01
- term: Approver
  definition: Person who checks and approves an expense claim, normally the direct manager.
  source_id: S01
- term: Per diem
  definition: Fixed daily allowance for meals and incidental costs on overnight business travel.
  source_id: S01
