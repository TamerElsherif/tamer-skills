- path: scenes/3/narration/0/text
  src: ^ When you travel, these limits apply. Meals are sixty dollars a day at home, and eighty-five dollars abroad. Hotels are capped at two hundred and twenty dollars a night, unless the Travel Desk approves
    an exception in writing. Flights under six hours are economy. And alcohol is only paid for client entertainment your manager approved in advance.
  tr: ^ لما تسافر، دي الحدود اللي ماشية عليك. الأكل ستين دولار في اليوم جوّه البلد، وخمسة وتمانين دولار برّه. الفندق حدّه الأقصى متين وعشرين دولار في الليلة، إلا لو مكتب السفر وافق على استثناء كتابةً. الطيران
    أقل من ست ساعات يبقى درجة سياحية. والكحول مش بيتصرف غير في ضيافة عميل مديرك وافق عليها مسبقاً.
  cues: 1
  hints:
  - client → العميل
  - manager → المدير
