- path: scenes/7/narration/0/text
  src: Three things you must never do. ^ Never split one expense into several claims to stay under a limit. ^ Never submit personal costs or private upgrades. ^ And never inflate a claim. False claims are
    treated as misconduct, and can lead to dismissal. Instead, ^ submit each expense once, with its real amount, ^ and ask Finance when you're unsure.
  tr: فيه تلات حاجات عمرك ما تعملها. ^ متقسّمش مصروف واحد على كذا مطالبة عشان تفضل تحت الحد. ^ متقدّمش مصاريف شخصية أو ترقيات خاصة. ^ ومتزوّدش أي مطالبة. المطالبة الكدب بتتعتبر مخالفة جسيمة، وممكن توصل
    للفصل. بدل كده، ^ قدّم كل مصروف مرة واحدة بمبلغه الحقيقي، ^ ولو مش متأكد، اسأل المالية.
  cues: 5
  hints:
  - False → غلط
  - do → اعمل
