- path: scenes/2/narration/0/text
  src: Four rules come before anything else. ^ Keep an itemised receipt for every expense over twenty-five dollars. A card statement alone doesn't count. ^ Submit within thirty days of the expense. ^ After
    ninety days, a claim isn't paid at all. ^ And personal costs, like family meals, are never business expenses.
  tr: فيه أربع قواعد قبل أي حاجة. ^ أي مصروف فوق خمسة وعشرين دولار لازم له إيصال مفصّل، وكشف حساب الكارت لوحده مش بيتحسب إيصال. ^ قدّم المطالبة خلال تلاتين يوم من تاريخ المصروف. ^ وبعد تسعين يوم، المطالبة
    مش بتتصرف خالص. ^ والمصاريف الشخصية، زي أكل العيلة، عمرها ما تبقى مصاريف شغل.
  cues: 4
  hints:
  - Submit → إرسال
  - receipt → الإيصال
