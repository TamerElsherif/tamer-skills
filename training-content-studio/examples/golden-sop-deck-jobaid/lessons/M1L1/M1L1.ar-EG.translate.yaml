- path: scenes/4/narration/0/text
  src: Now, the claim itself, in six steps. ^ Photograph the receipt on the same day. ^ Open the Northwind Expenses app and select New Claim. ^ Choose the category, then enter the date, amount and business
    purpose. ^ Attach the receipt photo to each line, and check the total. ^ Submit it to your approver within thirty days. ^ And answer any question from your approver within five business days.
  tr: دلوقتي، المطالبة نفسها في ست خطوات. ^ صوّر الإيصال في نفس اليوم. ^ افتح تطبيق Northwind Expenses واختار New Claim. ^ اختار الفئة، وبعدين دخّل التاريخ والمبلغ والغرض من المصروف. ^ ارفع صورة الإيصال
    على كل سطر، واتأكد من الإجمالي. ^ ابعت المطالبة للمسؤول عن الموافقة خلال تلاتين يوم. ^ ولو سألك أي سؤال، رد عليه خلال خمس أيام شغل.
  cues: 6
  hints:
  - Submit → إرسال
  - approver → اللي بيوافق (المعتمِد)
  - receipt → الإيصال
