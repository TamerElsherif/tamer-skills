schema_version: "1.0"
course:
  id: security-basics
  title: Security Basics
  title_ar: أساسيات الأمان
  domain: security-awareness
  audience: {level: beginner, roles: [all-staff]}
  languages: {primary: en-US, secondary: [ar-EG]}
  total_minutes: 15
  targets: [lesson, scorm, deck, jobaid]
objectives:
  - {id: O1, text: Recognise the red flags of a phishing email, bloom: understand}
  - {id: O2, text: Report a suspicious email correctly, bloom: apply}
  - {id: O3, text: Create a strong passphrase, bloom: apply}
modules:
  - id: M1
    title: Everyday security
    title_ar: الأمان اليومي
    lessons:
      - {id: M1L1, title: Spotting Phishing Emails, objective_ids: [O1, O2], formats: [explainer, branching], duration_min: 5, targets: [lesson, scorm]}
      - {id: M1L2, title: Strong Passwords, title_ar: كلمات المرور القوية, objective_ids: [O3], formats: [explainer, mindmap], duration_min: 4, targets: [lesson, scorm]}
  - id: M2
    title: Template gallery
    lessons:
      - {id: M2L1, title: All templates, objective_ids: [O1], formats: [explainer], duration_min: 6, targets: [lesson]}
approval: {status: auto-approved, by: test}
