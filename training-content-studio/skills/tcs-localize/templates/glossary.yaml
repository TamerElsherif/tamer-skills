# Bilingual glossary (EN ↔ Egyptian Arabic ↔ MSA). Copy to runs/<run>/glossary.yaml and extend per course;
# domain packs (domains/<pack>/glossary.yaml) add their own. `keep` = keep the English term in narration/on screen.
# Egyptian narration often keeps English tech terms (as staff say them); MSA prefers the Arabic term.
