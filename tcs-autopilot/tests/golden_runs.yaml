# Golden runs for the autopilot decision engine (scripts/decide.py).
# Run: .venv/bin/python skills/tcs-autopilot/scripts/test_decisions.py
# expect keys are dotted paths into decisions.json. Matchers: plain value (==), {contains_all: [...]}, {not_contains: [...]},
# {len: n}, {in: [...]}, {min: n}, {max: n}.
- id: g1-netsuite-expenses
  request: "Teach new hires how to submit expenses in NetSuite"
  args: ["--sources", "./sop/expenses.pdf"]
  expect:
    summary.objective_type: procedure
    summary.audience.level: beginner
    summary.language.primary: en-US
    summary.formats: [screencast-sim, job-aid]
    plan.lessons: {len: 3}
    summary.targets: {contains_all: [video, video-vertical, jobaid, scorm]}
    summary.wpm: 130
    scope: full
    pause_after: null

- id: g2-phishing-arabic
  request: "توعية الموظفين بالتصيد الاحتيالي"
  args: []
  expect:
    summary.language.primary: {in: [ar-MSA, ar-EG]}
    summary.language.subtitles: {contains_all: [en-US]}
    summary.formats: [cartoon, branching]
    summary.assessment: {in: [knowledge-check, post-test, scenario]}
    summary.domain_pack: security-awareness
    summary.targets: {contains_all: [scorm, video-vertical]}
    summary.aspects: {contains_all: ["9:16"]}
    summary.has_sources: false
    warnings: {len: 1}
    summary.wpm: 126

- id: g3-retention-policy-managers
  request: "Explain our new data retention policy to managers"
  args: ["--sources", "./policies/", "--review", "skeleton"]
  expect:
    summary.objective_type: policy
    summary.formats: [narrated-deck, job-aid]
    summary.audience.segment: executive
    summary.targets: {contains_all: [deck, jobaid]}
    pause_after: plan
    scope: full

# ---- guardrails and overrides (beyond the three required goldens)
- id: g4-high-stakes-no-sources
  request: "Create a course on CPR and first aid for warehouse staff"
  args: []
  expect:
    scope: plan-only
    pause_after: plan
    flagged_top: {min: 1}

- id: g5-flag-overrides-wording
  request: "توعية الموظفين بالتصيد الاحتيالي"
  args: ["--lang", "en", "--targets", "video,scorm", "--aspect", "9:16", "--domain", "security-awareness"]
  expect:
    summary.language.primary: en-US
    summary.targets: [video, scorm]
    summary.aspects: ["9:16"]
    summary.domain_pack: security-awareness

- id: g6-wording-pins-format
  request: "Make a short deck explaining our travel policy to all staff"
  args: ["--sources", "./travel.pdf"]
  expect:
    summary.formats: {contains_all: [narrated-deck]}
    summary.objective_type: policy

- id: g7-budget-reduces-scope
  request: "Teach new hires how to submit expenses in NetSuite"
  args: ["--sources", "./sop/expenses.pdf", "--budget", "0.6$"]
  expect:
    estimate.usd: {max: 0.6}
    plan.lessons: {max: 2}

- id: g8-mena-english-request
  request: "Train our Riyadh sales team on handling customer complaints"
  args: []
  expect:
    summary.language.primary: {in: [ar-MSA, ar-EG]}
    summary.language.subtitles: {contains_all: [en-US]}
    summary.objective_type: behavior

- id: g9-low-confidence-flagged
  request: "Quantum computing"
  args: ["--review", "none"]
  expect:
    flagged_top: {min: 1}
    summary.objective_type: concept
