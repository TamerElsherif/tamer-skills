# Tunable decision rules for tcs-autopilot (read by scripts/decide.py; explained in references/decision-rules.md).
# Patterns: English = case-insensitive regex with word boundaries added; Arabic = plain substring (prefixes like ب/ال attach).
version: 1
critical_keys: [domain, audience, objectives]
critical_confidence: 0.5          # below this with --review none -> proceed but flag at top of REPORT.md

# ------------------------------------------------------------------ language
language:
  arabic_ratio: 0.3               # share of letters in Arabic script that makes a request "Arabic"
  arabic_default: ar-EG           # user default: Egyptian colloquial narration; formal/MSA cues switch to ar-MSA
  egyptian_cues: ["مصر", "القاهرة", "egypt", "egyptian", "cairo", "عايز", "إزاي", "ازاي", "دلوقتي", "مش ", "بتاع", "كده", "عشان"]
  mena_cues: ["mena", "middle east", "gulf", "gcc", "ksa", "saudi", "riyadh", "jeddah", "uae", "dubai", "abu dhabi", "qatar", "doha",
              "kuwait", "bahrain", "oman", "jordan", "amman", "egypt", "cairo", "alexandria", "morocco", "tunisia", "algeria", "arabic-speaking"]
  english_default: en-US
  en_gb_cues: ["\\buk\\b", "united kingdom", "britain", "organisation", "colleagues in london", "nhs"]
  explicit_ar: ["in arabic", "arabic version", "بالعربي", "باللغة العربية"]
  explicit_en: ["in english", "بالإنجليزي", "باللغة الإنجليزية"]

# ------------------------------------------------------------------ audience (first match wins; order matters)
audience:
  cues:
    - {id: executives, segment: executive, level: intermediate, roles: [exec], confidence: 0.8,
       patterns: ["executives?", "c-suite", "board members?", "the board", "leadership team", "senior leaders?", "senior management", "التنفيذيين", "مجلس الإدارة", "الإدارة العليا", "القيادات"]}
    - {id: managers, segment: executive, level: beginner-intermediate, roles: [manager], confidence: 0.75,
       patterns: ["managers?", "supervisors?", "team leads?", "line managers?", "people leaders?", "المديرين", "المدراء", "مديري"]}
    - {id: new-hires, segment: staff, level: beginner, roles: [learner, rookie], confidence: 0.8,
       patterns: ["new hires?", "new joiners?", "new starters?", "new employees", "onboarding", "newcomers", "interns?", "الموظفين الجدد", "المعينين الجدد", "الموظفون الجدد"]}
    - {id: technical, segment: technical, level: technical, roles: [engineer], confidence: 0.75,
       patterns: ["engineers?", "developers?", "devops", "sysadmins?", "it team", "it staff", "data scientists?", "المهندسين", "المطورين", "فريق تقنية المعلومات"]}
    - {id: customer-facing, segment: staff, level: beginner-intermediate, roles: [support, customer], confidence: 0.7,
       patterns: ["sales team", "support agents?", "customer service", "call cent(er|re)", "front desk", "خدمة العملاء"]}
    - {id: my-team, segment: staff, level: mixed, roles: [colleague], confidence: 0.55,
       patterns: ["my team", "our team", "the team", "فريقي", "فريقنا", "الفريق"]}
    - {id: all-staff, segment: staff, level: mixed, roles: [learner], confidence: 0.7,
       patterns: ["all staff", "all employees", "employees", "everyone", "staff", "workforce", "colleagues", "الموظفين", "العاملين", "جميع الموظفين", "الموظفون"]}
  default: {id: general, segment: staff, level: mixed, roles: [learner], confidence: 0.4}
  explicit_level: {beginner: ["beginners?", "no experience", "مبتدئين"], advanced: ["advanced", "experts?", "experienced", "متقدم"]}
  # jargon density = technical terms / words. technical audience + technical topic -> intermediate
  technical_terms: ["api", "sql", "kubernetes", "docker", "terraform", "ci/cd", "pipeline", "latency", "encryption", "tls", "oauth", "regex",
                    "microservices?", "schema", "backend", "frontend", "compiler", "netsuite", "erp", "crm", "siem", "endpoint", "firewall", "vpn", "git"]
  technical_topic_density: 0.08
  level_resolution: {mixed: beginner-intermediate, technical_with_technical_topic: intermediate, technical_otherwise: beginner-intermediate}

# ------------------------------------------------------------------ objective type (votes; ties by precedence)
objective_types:
  precedence: [policy, procedure, behavior, adoption, recall, structure, concept]
  patterns:
    procedure: ["how to", "step[- ]by[- ]step", "submit", "configure", "set ?up", "install", "process(es)?", "workflow", "procedures?", "sop",
                "fill (in|out)", "book", "request", "approve", "log ?in", "كيفية", "خطوات", "طريقة", "إجراءات"]
    policy: ["polic(y|ies)", "compliance", "regulations?", "retention", "code of conduct", "gdpr", "hipaa", "iso ?27001", "mandatory", "rules?",
             "سياسة", "سياسات", "الامتثال", "اللوائح", "الالتزام"]
    behavior: ["awareness", "phishing", "scams?", "fraud", "social engineering", "recogni[sz](e|ing)", "spot(ting)?", "avoid(ing)?", "respond(ing)?", "handl(e|ing)", "deal(ing)? with",
               "conversations?", "feedback", "conflicts?", "complaints?", "negotiat\\w*", "difficult customers?", "de-?escalat\\w*", "safety culture", "توعية", "التصيد", "الاحتيال", "التعامل", "الهندسة الاجتماعية"]
    concept: ["explain", "what is", "what are", "introduction", "intro to", "overview", "basics", "fundamentals", "understand", "why",
              "شرح", "مقدمة", "ما هو", "ما هي", "أساسيات", "مفهوم"]
    structure: ["architecture", "structure", "taxonomy", "org(anization|anisation)? chart", "framework", "components", "landscape", "ecosystem",
                "map of", "how .* fits together", "هيكل", "بنية", "مكونات"]
    recall: ["memori[sz]e", "terminology", "glossary", "vocabulary", "product catalog(ue)?", "specs", "certification exam", "flash ?cards", "مصطلحات", "حفظ"]
    adoption: ["roll ?out", "adoption", "change management", "over (\\d+|several|multiple|the next) weeks", "habits?", "campaign", "drip", "nudges?", "تبني", "حملة"]
  # sources.yaml fact kinds also vote (weight each kind count / total * 3)
  fact_kind_votes: {procedure: procedure, step: procedure, policy: policy, definition: concept, term: recall, case: behavior, example: concept, warning: behavior}

high_stakes:   # no sources + any of these -> plan only, ask for sources
  medical: ["medical", "medication", "dosage", "clinical", "patients?", "diagnos\\w+", "nursing", "first aid", "cpr", "طبي", "الأدوية", "المرضى", "الإسعافات"]
  legal: ["legal advice", "litigation", "contract law", "court", "lawsuit", "قانوني", "المحكمة"]
  financial: ["investment advice", "tax filing", "ifrs", "gaap", "trading", "anti-money laundering", "aml", "ضريب", "استثمار"]
  safety-critical: ["lockout", "tagout", "loto", "hazmat", "forklift", "electrical safety", "working at height", "confined space", "chemical handling",
                    "aviation", "fire safety", "السلامة المهنية", "المواد الخطرة"]

software_cues: ["software", "app", "application", "system", "tool", "portal", "dashboard", "screen", "click", "netsuite", "sap", "salesforce", "workday",
                "jira", "confluence", "excel", "sheets", "teams", "outlook", "sharepoint", "servicenow", "oracle", "erp", "crm", "hris", "odoo", "zoho",
                "hubspot", "slack", "power bi", "tableau", "برنامج", "نظام", "تطبيق", "منصة"]
visual_cues: ["equipment", "machine", "factory", "plant", "lab", "laboratory", "warehouse", "site", "field", "vehicle", "building", "hardware",
              "product", "anatomy", "manufacturing", "travel", "مصنع", "معمل", "مستودع", "معدات"]

# ------------------------------------------------------------------ formats
formats_by_type:
  concept: {formats: [explainer], assessment: knowledge-check}
  structure: {formats: [mindmap], assessment: knowledge-check}
  procedure: {formats: [screencast-sim, job-aid], formats_non_software: [explainer, job-aid], assessment: scenario}
  behavior: {formats: [cartoon, branching], assessment: knowledge-check}
  policy: {formats: [cartoon], assessment: post-test, evidence: true}
  recall: {formats: [series], assessment: flashcards}
  adoption: {formats: [series], assessment: knowledge-check}
segment_overrides:
  executive:     # executives/managers -> narrated deck primary; secondary kept only if it is a take-away
    primary: narrated-deck
    keep_secondary: [job-aid, branching]
    secondary_by_type: {policy: job-aid, procedure: job-aid}
explicit_formats:   # wording in the request pins formats (source=request)
  narrated-deck: ["deck", "slides", "presentation", "powerpoint", "pptx", "عرض تقديمي", "شرائح"]
  cartoon: ["cartoon", "animated story", "animation", "micro-?drama", "كرتون", "رسوم متحركة"]
  doodle: ["whiteboard", "doodle", "سبورة"]
  comic: ["comic", "كوميك"]
  mindmap: ["mind ?map", "خريطة ذهنية"]
  branching: ["branching", "choose your own", "interactive scenario", "سيناريو تفاعلي"]
  job-aid: ["job aid", "cheat ?sheet", "quick reference", "one-pager", "checklist", "دليل سريع"]
  series: ["series", "drip", "nudges?", "سلسلة"]
  screencast-sim: ["screencast", "walkthrough", "software demo", "click-through", "شرح الشاشة"]
  explainer: ["explainer", "فيديو توضيحي"]
blend: {max_per_lesson: 2, max_per_course: 3}

# ------------------------------------------------------------------ length & pace
length:
  default_objectives: 3
  min_objectives: 3
  max_objectives: 5
  objectives_per_lesson: 1
  max_lessons_per_module: 6
  minutes_by_type: {concept: 4, structure: 4, procedure: 5, behavior: 5, policy: 5, recall: 3, adoption: 3}
  minutes_band: [3, 7]
wpm: {beginner: 130, beginner-intermediate: 140, intermediate: 145, advanced: 155, arabic_factor: 0.9}
verbosity: {beginner: standard, beginner-intermediate: standard, intermediate: standard, advanced: concise, executive: concise}

# ------------------------------------------------------------------ targets
format_targets:
  explainer: [video]
  doodle: [video]
  cartoon: [video]
  screencast-sim: [video]
  mindmap: [video]
  series: [video]
  narrated-deck: [deck, video]
  branching: [lesson]
  comic: [lesson]
  job-aid: [jobaid]
video_nudge_cut: true          # any video format -> + 9:16 nudge cut (video-vertical)
scorm_min_lessons: 2           # >= N lessons -> + SCORM (policy/compliance always)

# ------------------------------------------------------------------ domain packs (plus domains/*/pack.yaml `match.keywords`)
domain_packs:
  security-awareness: ["phishing", "smishing", "vishing", "cyber", "security awareness", "password", "mfa", "ransomware", "malware",
                       "social engineering", "deepfake", "scam", "التصيد", "الاحتيال", "الأمن السيبراني", "أمن المعلومات", "كلمة المرور", "كلمات المرور"]
domain_by_type: {procedure: software-procedure, policy: policy-compliance, behavior: workplace-behavior, concept: general, structure: general,
                 recall: general, adoption: change-adoption}
fallback_pack: _template

# ------------------------------------------------------------------ cost estimate (rough; tune to your models)
estimate:
  tokens_base_per_lesson: 18000
  tokens_per_format: {explainer: 6000, doodle: 6000, cartoon: 9000, comic: 8000, narrated-deck: 5000, mindmap: 4000, branching: 10000,
                      screencast-sim: 7000, job-aid: 3000, series: 6000}
  extra_language_factor: 0.5     # each extra language adds 50% of the lesson tokens
  usd_per_mtok: 9.0              # blended input/output price
  tts_usd_per_min: 0.015
  images_per_lesson: {explainer: 3, doodle: 0, cartoon: 0, comic: 4, narrated-deck: 2, mindmap: 0, branching: 0, screencast-sim: 0, job-aid: 0, series: 2}
  usd_per_image: 0.04
